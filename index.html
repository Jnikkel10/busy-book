<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Busy Book</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Busy Book">
<meta name="theme-color" content="#FFF4E4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--plum:#4A2E3A;--cream:#FFF8E7;--bg:#FFF4E4;--sky:#BFDDF2;--lav:#CFC8EE}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  display:grid;place-items:center;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);box-sizing:border-box}
@font-face{font-family:"Poppins";font-weight:900;font-display:block;src:url(fonts/poppins-latin-900-normal.woff2) format("woff2")}
main{display:flex;gap:4vmin;align-items:flex-start;justify-content:center;width:100%;padding:0 4vmin;box-sizing:border-box}
.game{flex:1 1 0;max-width:46vw;display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.tile{position:relative;display:block;width:100%;aspect-ratio:3/2;border:6px solid var(--plum);border-radius:5vmin;
  overflow:hidden;cursor:pointer;padding:0;background:var(--sky);box-shadow:0 1.4vmin 0 rgba(74,46,58,.22);
  animation:bob 3s ease-in-out infinite alternate}
.game:nth-child(2) .tile{animation-delay:-1.5s;background:var(--lav)}
.tile img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;pointer-events:none}
.name{width:92%;height:auto;overflow:visible;pointer-events:none}
.name text{font-family:"Poppins","Arial Black",sans-serif;font-weight:900;font-size:92px;letter-spacing:5px;
  fill:var(--cream);stroke:var(--plum);stroke-width:16px;paint-order:stroke fill;stroke-linejoin:round}
.tile.go{animation:squash .45s ease forwards}
@keyframes bob{from{transform:translateY(-.6vmin)}to{transform:translateY(.6vmin)}}
@keyframes squash{0%{transform:scale(1)}30%{transform:scale(1.08,.9)}60%{transform:scale(.94,1.08) translateY(-3vmin)}100%{transform:scale(1.04)}}
#status{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0));text-align:center;
  font:600 13px/1.2 -apple-system,system-ui,sans-serif;color:rgba(74,46,58,.55)}
@media (orientation:portrait){main{flex-direction:column;align-items:center}.game{max-width:80vw;width:80vw;flex:none}}
</style>
</head>
<body>
<main>
  <div class="game">
    <button class="tile" id="lionTile" data-href="lion/index.html" aria-label="Lion's Letters">
      <img src="icons/lion-home.webp" alt="" draggable="false">
    </button>
    <svg class="name" viewBox="0 0 1000 150" aria-hidden="true"><text x="500" y="112" text-anchor="middle">LION'S LETTERS</text></svg>
  </div>
  <div class="game">
    <button class="tile" id="pandaTile" data-href="panda/index.html" aria-label="Panda's Planets">
      <img src="icons/panda-home.webp" alt="" draggable="false">
    </button>
    <svg class="name" viewBox="0 0 1000 150" aria-hidden="true"><text x="500" y="112" text-anchor="middle">PANDA'S PLANETS</text></svg>
  </div>
</main>
<div id="status">Getting ready for offline…</div>
<script>
document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
  if (document.querySelector('.tile.go')) return;
  t.classList.add('go');
  setTimeout(() => { location.href = t.dataset.href; }, 420);
}));
addEventListener('pageshow', () => document.querySelectorAll('.tile.go').forEach(t => t.classList.remove('go')));
document.addEventListener('gesturestart', e => e.preventDefault());

const status = document.getElementById('status');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'cached') status.textContent = e.data.ok ? 'Ready to play offline ✓' : 'Offline download incomplete — reopen on Wi-Fi';
  });
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(reg => {
    reg.active && reg.active.postMessage({ type: 'check' });
  }).catch(() => { status.textContent = 'Offline mode not available in this browser'; });
} else {
  status.textContent = 'Offline mode not available in this browser';
}
</script>
</body>
</html>
