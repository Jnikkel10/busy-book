<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lion's Letter Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one fixed 4:3 stage (2400×1792 units, the scene art's own size) scaled to fit any screen.
   Single deliberate look: the picture-book palette of the scene art, not light/dark themed. */
:root{
  --plum:#4A2E3A;        /* the art's outline color */
  --cream:#FFF8E7;       /* found letters */
  --marker:#5B8FD8;      /* Lion's marker */
  --letterbox:#2f2430;   /* bars around the stage */
  --bar:rgba(255,252,244,.80);
  --spark:#FFD66B;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);margin:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;width:2400px;height:1792px;transform-origin:0 0;overflow:hidden;background:#e9e2cf;border-radius:0}
.layer{position:absolute;inset:0}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transition:opacity .9s ease}
#letters{position:absolute;inset:0}
.hit{position:absolute;width:220px;height:220px;margin:-110px 0 0 -110px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit svg{height:160px;width:auto;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(255,255,255,.85)) drop-shadow(0 0 30px rgba(255,255,255,.5))}
.hit.partial svg{height:142px}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(var(--r,0deg))}20%{transform:rotate(calc(var(--r,0deg) - 14deg))}40%{transform:rotate(calc(var(--r,0deg) + 12deg))}60%{transform:rotate(calc(var(--r,0deg) - 8deg))}80%{transform:rotate(calc(var(--r,0deg) + 4deg))}}

/* alphabet bar */
#bar{position:absolute;left:28px;right:28px;top:14px;height:136px;background:var(--bar);border:6px solid var(--plum);border-radius:34px;
  display:grid;grid-template-columns:repeat(26,1fr);align-items:center;padding:0 14px;box-sizing:border-box}
.slot{height:100px;margin:0 3px;border-radius:18px;border:4px dashed rgba(74,46,58,.28);display:grid;place-items:center;box-sizing:border-box}
.slot.full{border:4px solid transparent}
.slot svg{height:78px;width:auto;overflow:visible}
.slot.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) translateY(-10px)}100%{transform:scale(1)}}

/* Lion's card */
#card{position:absolute;left:30px;bottom:30px;width:580px;height:580px;background:#fff;border:8px solid var(--plum);border-radius:56px;overflow:hidden;box-sizing:border-box}
#card .pose{position:absolute;inset:0;width:100%;height:100%;max-width:none}
#lion{position:absolute;inset:-2px}
#dance{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);object-fit:cover;filter:brightness(1.016);background:#fff}
#face{position:absolute;left:24.76%;top:51.0%;width:50.5%;height:25.1%;perspective:900px}
#faceInner{position:absolute;inset:0;transform-style:preserve-3d}
#front,#back{position:absolute;inset:0;border-radius:9%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
#front{background:#FAF4E8}
#back{background:#B9D3EA;transform:rotateY(180deg)}
#front svg{display:block;height:78%;width:auto;max-width:90%;overflow:visible}
.hop{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-34px)}60%{transform:translateY(0)}78%{transform:translateY(-10px)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-2deg)}50%{transform:translateX(9px) rotate(2deg)}75%{transform:translateX(-5px)}}

/* effects */
.spark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none}
.flyer{position:absolute;pointer-events:none;z-index:20}
.flyer svg{height:160px;width:auto;overflow:visible}

/* party */
#party{position:absolute;inset:0;z-index:40;background:#000}
#party video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#again{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:10px solid var(--plum);background:var(--cream);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 0 rgba(74,46,58,.25);animation:breathe 1.6s ease-in-out infinite}
#again:focus-visible,.parent button:focus-visible{outline:6px solid var(--marker);outline-offset:6px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* parent menu (long-press the alphabet bar) */
.parent{position:absolute;right:40px;top:170px;z-index:50;background:#fff;border:6px solid var(--plum);border-radius:30px;padding:26px;display:flex;gap:20px;
  font:800 44px/1.1 system-ui,sans-serif;color:var(--plum)}
.parent button{font:inherit;color:inherit;background:var(--cream);border:5px solid var(--plum);border-radius:22px;padding:18px 30px;cursor:pointer}

/* rotate hint for phones held upright */
#rotate{position:fixed;inset:0;z-index:60;background:var(--letterbox);display:grid;place-items:center;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
#rotate svg{width:min(46vw,220px);height:auto}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="stage">
  <img id="sceneA" class="scene" alt="" draggable="false">
  <img id="sceneB" class="scene" alt="" draggable="false" style="opacity:0">
  <div id="letters"></div>
  <div id="bar" aria-label="Alphabet"></div>
  <div id="card">
    <div id="lion">
      <img id="poseWrite" class="pose" src="assets/lion-write.webp" alt="Lion writing" draggable="false">
      <img id="poseHold" class="pose" src="assets/lion-hold.webp" alt="Lion holding the letter" draggable="false" hidden>
      <div id="face"><div id="faceInner"><div id="front"></div><div id="back"></div></div></div>
    </div>
    <video id="dance" src="assets/lion-dance.mp4" muted playsinline preload="auto" hidden></video>
  </div>
  <div id="fx" class="layer" style="pointer-events:none"></div>
  <div id="party" hidden>
    <video id="partyVid" src="assets/party.mp4" muted playsinline preload="auto"></video>
    <canvas id="confetti" width="2400" height="1792"></canvas>
    <button id="again" aria-label="Play again" hidden>
      <svg viewBox="0 0 100 100" width="150" height="150"><path d="M30 22 L78 50 L30 78 Z" fill="#7FC28B" stroke="#4A2E3A" stroke-width="7" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<div id="rotate" hidden aria-label="Turn the phone sideways">
  <svg viewBox="0 0 200 200"><rect x="62" y="22" width="76" height="140" rx="16" fill="#FFF8E7" stroke="#FFF8E7" stroke-width="8" opacity=".35"/>
  <g style="transform-origin:100px 100px;animation:turn 2.4s ease-in-out infinite"><rect x="62" y="22" width="76" height="140" rx="16" fill="none" stroke="#FFF8E7" stroke-width="8"/><circle cx="100" cy="146" r="6" fill="#FFF8E7"/></g>
  <style>@keyframes turn{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}</style></svg>
</div>

<script src="data.js"></script>
<script>
(() => {
const D = window.LH_DATA, PLUM = '#4A2E3A', CREAM = '#FFF8E7', MARKER = '#5B8FD8';
const W = 2400, H = 1792, ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', ROUNDS = [5,5,5,5,6];
const $ = id => document.getElementById(id);
const stage = $('stage'), lettersEl = $('letters'), bar = $('bar'), fx = $('fx');
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- fit the stage to any screen ---------- */
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  stage.style.transform = `scale(${s}) translate(-50%,-50%)`;
  $('rotate').hidden = !(vh > vw * 1.08) || rotateDismissed;
}
let rotateDismissed = false;
$('rotate').addEventListener('click', () => { rotateDismissed = true; fit(); });
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();

/* ---------- letters drawn from Poppins Black outlines ---------- */
function glyph(ch, fill, opts = {}) {
  const g = D.glyphs[ch], sw = opts.sw ?? 80, pad = sw;
  const [x, y, w, h] = g.b;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `${x - pad} ${y - pad} ${w + pad * 2} ${h + pad * 2}`);
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', g.d); p.setAttribute('fill', fill);
  p.setAttribute('stroke', PLUM); p.setAttribute('stroke-width', sw);
  p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('paint-order', 'stroke');
  svg.appendChild(p);
  return svg;
}

/* ---------- saved progress (this device only) ---------- */
const KEY = 'lionLetterHunt.v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function freshAlphabet() { return { deck: shuffle(ABC.split('')), round: 0, found: [], lastScene: S?.lastScene ?? -1 }; }
let S = load(); if (!S || !Array.isArray(S.deck) || S.deck.length !== 26) S = freshAlphabet();

/* ---------- alphabet bar ---------- */
const slots = {};
ABC.split('').forEach(ch => { const d = document.createElement('div'); d.className = 'slot'; bar.appendChild(d); slots[ch] = d; });
function fillSlot(ch) { const s = slots[ch]; s.innerHTML = ''; s.appendChild(glyph(ch, CREAM, { sw: 90 })); s.classList.add('full'); }
function clearBar() { ABC.split('').forEach(ch => { slots[ch].innerHTML = ''; slots[ch].classList.remove('full'); }); }
S.found.forEach(fillSlot);
function slotCenter(ch) { // in stage units
  const st = stage.getBoundingClientRect(), r = slots[ch].getBoundingClientRect(), k = W / st.width;
  return { x: (r.left + r.width / 2 - st.left) * k, y: (r.top + r.height / 2 - st.top) * k };
}

/* ---------- Lion's card ---------- */
const poseWrite = $('poseWrite'), poseHold = $('poseHold'), front = $('front'), faceInner = $('faceInner'), card = $('card');
function pose(which) { poseWrite.hidden = which !== 'write'; poseHold.hidden = which !== 'hold'; }
async function writeLetter(ch) {
  pose('write'); front.innerHTML = '';
  const svg = glyph(ch, MARKER, { sw: 70 });
  const fillPath = svg.querySelector('path'); fillPath.style.opacity = 0;
  const pen = fillPath.cloneNode(); pen.setAttribute('fill', 'none'); pen.setAttribute('stroke', MARKER);
  pen.setAttribute('stroke-width', 60); pen.setAttribute('pathLength', 1);
  pen.style.strokeDasharray = 1; pen.style.strokeDashoffset = 1; pen.style.opacity = 1;
  svg.insertBefore(pen, fillPath); front.appendChild(svg);
  await pen.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 1300, easing: 'ease-in-out', fill: 'forwards' }).finished;
  await fillPath.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' }).finished;
  pen.remove();
  await wait(250);
  pose('hold');
  await faceInner.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(360deg)' }], { duration: 900, easing: 'cubic-bezier(.45,.05,.3,1)' }).finished;
}
function boardTap() { front.classList.remove('shake'); void front.offsetWidth; front.classList.add('shake'); }
function lionHop() { card.classList.remove('hop'); void card.offsetWidth; card.classList.add('hop'); }

/* ---------- rounds ---------- */
let roundLetters = [], targets = [], current = null, busy = true, sceneIdx = -1, frontScene = $('sceneA'), backScene = $('sceneB');
const roundStart = r => ROUNDS.slice(0, r).reduce((a, b) => a + b, 0);

function pickScene() {
  let i; do { i = rnd(D.scenes.length); } while (i === S.lastScene && D.scenes.length > 1);
  S.lastScene = i; return i;
}
async function showScene(i, instant) {
  const next = instant ? frontScene : backScene;
  next.src = D.scenes[i].img;
  try { await next.decode(); } catch {}
  if (!instant) { next.style.opacity = 1; frontScene.style.opacity = 0; [frontScene, backScene] = [backScene, frontScene]; await wait(900); }
  sceneIdx = i;
}
function placeLetters() {
  lettersEl.innerHTML = '';
  const spots = shuffle(D.scenes[sceneIdx].spots).slice(0, roundLetters.length);
  roundLetters.forEach((ch, k) => {
    const sp = spots[k], el = document.createElement('div');
    el.className = 'hit' + (sp.t === 'partial' ? ' partial' : '');
    el.style.left = sp.x / 100 * W + 'px'; el.style.top = sp.y / 100 * H + 'px';
    const r = sp.t === 'partial' ? (rnd(2) ? 1 : -1) * (6 + rnd(8)) : rnd(9) - 4;
    el.style.setProperty('--r', r + 'deg'); el.style.transform = `rotate(${r}deg)`;
    el.dataset.ch = ch;
    el.appendChild(glyph(ch, sp.c));
    el.addEventListener('pointerdown', e => { e.stopPropagation(); tapLetter(el); });
    lettersEl.appendChild(el);
  });
}
async function startRound(instantScene) {
  busy = true;
  if (S.round >= ROUNDS.length) { S = freshAlphabet(); clearBar(); }
  const a = roundStart(S.round);
  roundLetters = S.deck.slice(a, a + ROUNDS[S.round]).filter(ch => !S.found.includes(ch));
  if (!roundLetters.length) { S.round++; save(); return startRound(instantScene); }
  save();
  await showScene(pickScene(), instantScene);
  save();
  placeLetters();
  targets = shuffle(roundLetters);
  nextTarget();
}
async function nextTarget() {
  busy = true; current = targets.shift();
  await writeLetter(current);
  busy = false;
}
async function tapLetter(el) {
  const ch = el.dataset.ch;
  if (busy || !current) return;
  if (ch !== current) { el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); boardTap(); return; }
  busy = true;
  S.found.push(ch); save();
  // glow, then fly to the bar
  const svg = el.querySelector('svg');
  await svg.animate([{ transform: 'scale(1)', filter: 'drop-shadow(0 0 0 #fff)' }, { transform: 'scale(1.35)', filter: 'drop-shadow(0 0 24px #fff) drop-shadow(0 0 40px #FFD66B)' }], { duration: 380, easing: 'ease-out', fill: 'forwards' }).finished;
  const from = { x: parseFloat(el.style.left), y: parseFloat(el.style.top) }, to = slotCenter(ch);
  el.remove();
  burst(from.x, from.y, 14);
  const fly = document.createElement('div'); fly.className = 'flyer'; fly.appendChild(glyph(ch, CREAM)); fx.appendChild(fly);
  fly.style.left = from.x + 'px'; fly.style.top = from.y + 'px';
  const mid = { x: (from.x + to.x) / 2, y: Math.min(from.y, to.y) - 180 };
  await fly.animate([
    { transform: 'translate(-50%,-50%) scale(1.35)' },
    { transform: `translate(calc(-50% + ${mid.x - from.x}px), calc(-50% + ${mid.y - from.y}px)) scale(1.1)`, offset: .45 },
    { transform: `translate(calc(-50% + ${to.x - from.x}px), calc(-50% + ${to.y - from.y}px)) scale(.62)` }
  ], { duration: 850, easing: 'ease-in-out', fill: 'forwards' }).finished;
  fly.remove(); fillSlot(ch); slots[ch].classList.remove('pop'); void slots[ch].offsetWidth; slots[ch].classList.add('pop');
  lionHop();
  await wait(550);
  if (targets.length) { nextTarget(); return; }
  S.round++; save();
  if (S.found.length >= 26) celebrate(); else danceThenNext();
}

/* ---------- between scenes: Lion's dance ---------- */
async function danceThenNext() {
  const v = $('dance');
  front.innerHTML = ''; v.currentTime = 0; v.hidden = false;
  try { await v.play(); } catch {}
  await Promise.race([new Promise(r => v.addEventListener('ended', r, { once: true })), wait(6500)]);
  startRound(false);
  await wait(500); v.hidden = true; v.pause();
}

/* ---------- full alphabet: party ---------- */
async function celebrate() {
  for (const ch of ABC) { slots[ch].classList.remove('pop'); void slots[ch].offsetWidth; slots[ch].classList.add('pop'); await wait(70); }
  await wait(500);
  const party = $('party'), pv = $('partyVid'), again = $('again');
  party.hidden = false; again.hidden = true; pv.currentTime = 0;
  try { await pv.play(); } catch {}
  confetti(true);
  let plays = 1;
  pv.onended = () => { if (plays++ < 2) { pv.currentTime = 0; pv.play().catch(() => {}); } else { again.hidden = false; } };
  setTimeout(() => { again.hidden = false; }, 13500);
}
$('again').addEventListener('click', () => {
  $('party').hidden = true; $('partyVid').pause(); confetti(false);
  S = freshAlphabet(); clearBar(); save(); startRound(false);
});
let confettiOn = false;
function confetti(on) {
  confettiOn = on; if (!on) return;
  const c = $('confetti'), x = c.getContext('2d'), cols = ['#F6A5B4', '#9CC9EE', '#FFD66B', '#B9E0A5', '#C9B3E6', '#FFB98A'];
  const bits = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * -H, s: 14 + Math.random() * 16, v: 3 + Math.random() * 4, a: Math.random() * 6, w: .02 + Math.random() * .05, c: cols[rnd(cols.length)] }));
  (function tick() {
    if (!confettiOn) { x.clearRect(0, 0, W, H); return; }
    x.clearRect(0, 0, W, H);
    for (const b of bits) {
      b.y += b.v; b.a += b.w; b.x += Math.sin(b.a) * 2; if (b.y > H + 30) { b.y = -30; b.x = Math.random() * W; }
      x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.c; x.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); x.restore();
    }
    requestAnimationFrame(tick);
  })();
}

/* ---------- taps on the scenery: a little sparkle ---------- */
function burst(x0, y0, n = 9) {
  const ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < n; i++) {
    const s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', '-10 -10 20 20'); s.setAttribute('class', 'spark');
    s.innerHTML = '<path d="M0-9L2.3-2.3 9 0 2.3 2.3 0 9-2.3 2.3-9 0-2.3-2.3Z" fill="#FFD66B" stroke="#4A2E3A" stroke-width="1.2" stroke-linejoin="round"/>';
    s.style.left = x0 + 'px'; s.style.top = y0 + 'px'; fx.appendChild(s);
    const ang = (i / n) * Math.PI * 2 + Math.random() * .5, d = 70 + Math.random() * 60;
    s.animate([{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(1.1) rotate(90deg)`, opacity: 0 }],
      { duration: 650, easing: 'ease-out' }).finished.then(() => s.remove());
  }
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#bar,#card,#party,.parent')) return;
  const st = stage.getBoundingClientRect(), k = W / st.width;
  burst((e.clientX - st.left) * k, (e.clientY - st.top) * k);
});

/* ---------- parent menu: press and hold the alphabet bar ---------- */
let holdT;
bar.addEventListener('pointerdown', () => { holdT = setTimeout(openParent, 1500); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => bar.addEventListener(t, () => clearTimeout(holdT)));
function openParent() {
  if (document.querySelector('.parent')) return;
  const m = document.createElement('div'); m.className = 'parent';
  m.innerHTML = '<button id="restart">Start a new alphabet</button><button id="close">Close</button>';
  stage.appendChild(m);
  m.querySelector('#close').onclick = () => m.remove();
  m.querySelector('#restart').onclick = () => { m.remove(); S = freshAlphabet(); clearBar(); save(); startRound(false); };
}

window.__letterHunt = () => ({ current, busy, round: S.round, found: S.found.length, scene: sceneIdx });
startRound(true);
})();
</script>

<script src="../home-button.js"></script>
</body></html>
